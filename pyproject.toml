[project]
name = "ade-cli"
version = "1.0.3"
description = "CLI for Agentic Document Extraction (ADE) — parse and extract documents with the v2 APIs, backed by a local store"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.scripts]
ade = "ade_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
]
# Only the release workflow syncs this group — PyInstaller stays out of
# dev/test environments.
release = [
    "pyinstaller>=6.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ade_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Defaults (pyflakes F + pycodestyle errors) — F401 keeps imports honest.
select = ["E4", "E7", "E9", "F"]
