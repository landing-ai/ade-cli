<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ade crop</title>
<!-- Single-element crop artifact, visually consistent with view.html:
     same tokens/header/pane treatment (VUI globals.css), the same
     Markdown/JSON FormatToggle (ProjectParseTab.tsx:655-693), the crop
     shown as a page sheet on the doc-pane backdrop, and the citing
     extraction fields in the Results-section style. Self-contained. -->
<style>
  :root { --bg-main:#fff; --bg-raised:#fff; --bg-subtlest:#fafaf7; --bg-subtle:#f6f6ef;
    --bg-highlight:#efefe5; --bg-main-hovered:#f8fafc;
    --text-primary:#1a1916; --text-secondary:#44423c; --text-tertiary:#878682;
    --border-subtle:#e7e7d9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg-main); color:var(--text-primary);
    font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  header { display:flex; height:52px; flex-shrink:0; align-items:center; gap:8px;
    border-bottom:1px solid var(--border-subtle); background:var(--bg-raised); padding:0 16px; }
  .brand { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .crumb { color:var(--text-tertiary); }
  .doc-emoji { font-size:13px; }
  .doc-name { font-size:14px; font-weight:500; }
  header code { font-size:13px; }
  .badge { padding:1px 8px; border-radius:999px; font-size:11px; background:var(--bg-highlight); color:var(--text-secondary); }
  /* header action — VUI's Get Code button treatment (ProjectHeader.tsx:456-468) */
  header a { margin-left:auto; display:flex; align-items:center; padding:6px 10px; border-radius:4px;
    border:1px solid var(--border-subtle); background:var(--bg-main); font-size:13px; font-weight:500;
    color:var(--text-primary); text-decoration:none; }
  header a:hover { background:var(--bg-subtlest); }
  /* workflow pills — same as view.html (ProjectHeader.tsx:578-717) */
  #pills { position:absolute; left:50%; top:50%; transform:translateY(-50%); display:flex; align-items:center; }
  header { position:relative; }
  .pill { display:flex; align-items:center; gap:6px; border-radius:6px; border:1px solid var(--border-subtle);
    background:var(--bg-main); padding:4px 6px; }
  .pill.active { border-color:#CED6C8; background:var(--bg-highlight); }
  .pill .pill-label { font-size:12px; font-weight:500; color:var(--text-secondary); }
  .pill.active .pill-label { font-weight:600; color:var(--text-primary); }
  .connector { height:1px; width:16px; background:#E7E7D9; }
  main { flex:1; display:flex; min-height:0; }
  #docpane { width:50%; min-width:300px; background:var(--bg-highlight); overflow:auto; padding:16px; }
  /* sash — same allotment-style handle as view.html (VUI globals.css:726-753) */
  #sash { position:relative; width:1px; flex-shrink:0; background:var(--border-subtle); cursor:col-resize; }
  #sash::before { content:''; position:absolute; inset:0 -4px; }
  #sash::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:8px; height:36px; border-radius:6px; background:#f8fafc; border:1px solid var(--border-subtle); pointer-events:none; }
  body.resizing #sash { background:#039855; }
  .cropwrap { position:relative; }
  #docpane img { display:block; width:100%; height:auto; background:#fff; }
  /* atomic_grounding parts remapped into the crop's frame — same inset
     box-shadow sub-box treatment as the document viewer's line boxes */
  .part { position:absolute; box-shadow:inset 0 0 0 1px var(--c); cursor:default; }
  .part:hover { background:color-mix(in srgb, var(--c) 12%, transparent); }
  #docpane .meta { margin-top:6px; font-size:12px; color:var(--text-tertiary); }
  #rightpane { flex:1; min-width:0; display:flex; flex-direction:column; }
  /* toolbar + FormatToggle — same as view.html (ProjectParseTab.tsx:351,655-693) */
  #toolbar { z-index:20; display:flex; flex-shrink:0; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border-subtle); padding:12px 12px 8px; }
  .format-toggle { display:inline-flex; align-items:center; border-radius:6px; background:var(--bg-subtle); }
  .format-toggle button { display:flex; align-items:center; border-radius:6px; padding:6px 8px;
    border:1px solid transparent; }
  .format-toggle button.active { border-color:var(--border-subtle); background:var(--bg-main); }
  .format-toggle .seg-label { padding:0 6px; font-size:12px; line-height:16px; font-weight:500; }
  svg.i { width:16px; height:16px; }
  #content { min-height:0; flex:1; overflow:auto; }
  /* markdown row — same card treatment as the viewer's mdrow */
  #mdview { padding:16px 8px 8px; }
  .mdrow { position:relative; margin:12px 8px; padding:8px; border-radius:4px; border:1px solid var(--c); }
  .mdlabel { position:absolute; top:-12px; left:8px; border-radius:2px; padding:0 4px 0;
    border:2px solid var(--c); background:var(--c); color:#fff; font-size:12px; line-height:1.4; text-transform:capitalize; }
  .mdtext { white-space:pre-wrap; word-break:break-word; }
  /* region spans — same tiled treatment as the viewer's regionSegments */
  .mdtext span.region { border-radius:2px; box-decoration-break:clone; -webkit-box-decoration-break:clone; cursor:pointer; }
  .mdtext span.region:hover, .mdtext span.region.hov { background:color-mix(in srgb, var(--c) 20%, transparent); }
  .part.hov { background:color-mix(in srgb, var(--c) 12%, transparent); }
  /* rendered markdown (non-tiled elements: figures, single-line text) — same
     .mdbody treatment as view.html so the crop matches the full viewer, which
     keeps allowlisted tags (figure, br, …) and unwraps unknown ones like
     <description> to their text. Unlike view.html, .mdbody here lives inside
     .mdtext (white-space:pre-wrap, needed by the tiled-regions branch), so
     reset to the default view.html's .mdbody inherits — otherwise headings/
     lists would preserve whitespace the full viewer collapses. */
  .mdbody { white-space:normal; }
  .mdbody p, .mdbody div.rawhtml { margin:0 0 8px; white-space:pre-line; }
  .mdbody h1, .mdbody h2, .mdbody h3, .mdbody h4 { margin:4px 0 8px; line-height:1.3; }
  .mdbody ul { margin:0 0 8px; padding-left:22px; }
  .mdbody code { background:var(--bg-subtle); border-radius:3px; padding:0 4px; font-size:13px; }
  .mdbody a { color:#3b82f6; } .mdbody a:hover { text-decoration:underline; }
  .mdbody figure { margin:0 0 8px; white-space:pre-line; }
  .mdbody > :last-child { margin-bottom:0; }
  /* JSON view — same container as view.html's #jsonview */
  #jsonview { display:none; margin:8px; border-radius:5px; border:1px solid var(--border-subtle);
    background:var(--bg-subtlest); padding:8px 12px; overflow:auto;
    font:13px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre; }
  .j-key{color:#a31515} .j-str{color:#0451a5} .j-num{color:#098658} .j-lit{color:#0451a5}
  /* citing fields — the viewer's ex-section / ex-line styles */
  .ex-section { margin:0 8px 8px; border:1px solid var(--border-subtle); background:var(--bg-subtlest); }
  /* Section BODY is white like the playground (and view.html's .ex-sec-body):
     in VUI only the section container + header carry bg-subtlest; the
     expanded body is the Monaco editor's vs-theme background (#fffffe). */
  #fields { background:var(--bg-main); }
  .ex-sec-head { display:flex; height:24px; align-items:center; gap:4px; border-bottom:1px solid var(--border-subtle);
    padding:0 12px; font-size:12px; font-weight:500; }
  .ex-line { position:relative; min-height:20px; padding:2px 16px 2px 12px; border-left:2px solid transparent;
    font-size:13px; display:flex; flex-wrap:wrap; gap:2px 10px; }
  .ex-line:hover { border-left-color:#12B76A; background:rgba(18,183,106,.1); }
  .ex-line .fname { min-width:0; max-width:100%; font-weight:500; color:var(--text-secondary); overflow-wrap:anywhere; }
  .ex-line .fval { flex:1; min-width:200px; white-space:pre-wrap; word-break:break-word; }
  .ex-line code { margin-left:auto; }
  .ex-line code { font-size:11px; color:var(--text-tertiary); }
  .empty { padding:8px 12px; font-size:12.5px; color:var(--text-tertiary); }
  /* Extract tab: the viewer's Results | Schema split, scoped to the crop */
  #extract { display:none; flex-direction:row; min-height:0; flex:1; }
  .ex-half { flex:1; min-width:0; display:flex; flex-direction:column; }
  .ex-half:first-child { border-right:1px solid var(--border-subtle); }
  .ex-panel-head { display:flex; flex-shrink:0; align-items:center; gap:6px;
    border-bottom:1px solid var(--border-subtle); padding:8px 16px; }
  .ex-panel-head .ptitle { font-size:15px; font-weight:600; }
  .ex-scroll { min-height:0; flex:1; overflow:auto; }
  .sc-tree { padding:12px 16px 12px 8px; }
  .sc-row { position:relative; padding:5px 12px 5px 32px; border-radius:4px; }
  .sc-row:hover { background:var(--bg-subtlest); }
  .sc-row.hl { background:rgba(74,222,128,.1); }
  .schevbtn { position:absolute; left:16px; top:9px; display:flex; width:16px; height:16px;
    align-items:center; justify-content:center; cursor:pointer; color:var(--text-secondary); }
  .schevbtn svg { width:12px; height:12px; transform:rotate(90deg); transition:transform .15s; }
  .sc-row.closed .schevbtn svg { transform:rotate(0deg); }
  .ex-json-line { min-height:20px; padding:0 16px 0 12px; border-left:2px solid transparent;
    font:13px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space:pre; }
  .ex-json-line[data-path] { cursor:pointer; }
  .ex-json-line[data-path]:hover { border-left-color:#12B76A; background:rgba(18,183,106,.1); }
  .sc-row .sname { padding:2px 4px; font-size:14px; font-weight:600; }
  .sc-row .stype { display:inline-flex; border-radius:5px; padding:2px 8px; font-size:12px; font-weight:500; border:1px solid; }
  .stype.t-object{background:#ecfdf3;border-color:#d1fadf} .stype.t-string{background:#fefbe8;border-color:#fef7c3}
  .stype.t-number{background:#f4f3ff;border-color:#ebe9fe} .stype.t-boolean{background:#fef3f2;border-color:#fee4e2}
  .stype.t-enum{background:#ebf7ff;border-color:#def3ff}
  .sc-row .sdesc { padding:0 4px; font-size:12px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sc-kids { margin-left:16px; }
</style>
</head>

// (e.g. <description>) unwrap to their text, comments drop.
const el = (tag, cls, parent) => {

/* ── shared-md-renderer:begin — this block is duplicated verbatim in

function preprocessMarkdown(src) {
  let s = src;
  // step 2 — normalize "1.  " → "1. " (MemoizedReactMarkdown.tsx:204)
  s = s.replace(/^(\d+)([.)])\s{2,}/gm, "$1$2 ");
  // step 3 — zero-width space stops top-level <ol> promotion (:207-210)
  s = s.replace(/^(\d+)([.)]) /gm, "$1$2​ ");

  s = s.replace(/^(\d+\.\d+(\.\d+)*)(\.​)?\s+/gm, "**$1** ");

  s = s.replace(/^\s{4,}/gm, "");
  return s;
}

// Sanitize raw HTML the way rehypeRaw+rehypeSanitize does: allowlisted tags
// survive, unknown tags are unwrapped to their children, comments dropped.
const ALLOWED_TAGS = new Set(["figure", "br", "sub", "sup", "em", "strong", "b", "i",
  "u", "s", "p", "ul", "ol", "li", "blockquote", "code", "pre", "span", "table",
  "thead", "tbody", "tr", "td", "th", "h1", "h2", "h3", "h4", "h5", "h6", "hr"]);
function sanitizeInto(sourceNode, target) {

    } else if (node.nodeType === Node.ELEMENT_NODE) {

// Inline markdown: **bold**, `code`, [text](href). Applied to text nodes only.
function renderInline(text) {

    else if (m[2] !== undefined) el("code", "", frag).textContent = m[2];

      // artifact must not carry clickable script vectors.
      frag.append(m[3]);

  for (const block of text.split(/\n{2,}/)) {

(function () {

  const B = D.box, w = B.xmax - B.xmin, h = B.ymax - B.ymin;
  parts.forEach((g, i) => {

// Markdown tiled by atomic parts (the viewer's regionSegments path):
// grounded segments become hoverable spans synced with the crop's line

(function () {
  const host = document.getElementById("mdtext");
  const parts = ((D.element_json && D.element_json.atomic_grounding) || [])
    .map((g, i) => ({ start: g.range.start, end: g.range.end, i }))
    .sort((a, b) => a.start - b.start);

  let cursor = 0;
  const sync = (i, on) => {
    document.querySelectorAll(`.part[title$="-r${i}"], .region[data-r="${i}"]`)
      .forEach(n => n.classList.toggle("hov", on));

(function () {

  // Same union normalization as the viewer's typeBadge: ["string","null"]
  // is the ordinary nullable spelling, and treating the array as a string
  // threw TypeError out of the tree walk, truncating the panel silently.
  function soleType(type) {
    return Array.isArray(type) ? (type.find(t => t !== "null") || "null") : type;
  }
  function badge(spec) {
    const t = soleType(spec.type);
    const d = t === "array" ? soleType(spec.items && spec.items.type) || "object" : t || "string";
    const n = d === "integer" ? "number" : d;
    const label = n.charAt(0).toUpperCase() + n.slice(1);
    return { cls: "t-" + (["object","string","number","boolean","enum"].includes(n) ? n : "string"),
      label: t === "array" ? "Array of " + label : label };
  }
  (function tree(node, container, prefix) {
    for (const [name, spec] of Object.entries((node && node.properties) || {})) {
      const path = prefix ? prefix + "." + name : name;
      if (!related(path)) continue; // scoped: citing paths + ancestors only
      const row = document.createElement("div");
      row.className = "sc-row";
      row.dataset.spath = path;
      container.appendChild(row);
      const b = badge(spec);
      row.innerHTML = '<span class="sname"></span> <span class="stype ' + b.cls + '"></span>';
      row.querySelector(".sname").textContent = name;
      row.querySelector(".stype").textContent = b.label;
      if (spec.description) {
        const d = document.createElement("div");
        d.className = "sdesc";
        d.textContent = d.title = spec.description;
        row.appendChild(d);
      }
      const child = soleType(spec.type) === "array" ? spec.items : spec;
      if (child && child.properties) {
        // expand/collapse chevron, as in the viewer's schema tree
        const btn = document.createElement("button");
        btn.className = "schevbtn";
        btn.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M4.5 3L7.5 6L4.5 9"/></svg>';
        row.appendChild(btn);
        const kids = document.createElement("div");
        kids.className = "sc-kids";
        container.appendChild(kids);
        tree(child, kids, path);
        btn.onclick = ev => {
          ev.stopPropagation();
          const closed = row.classList.toggle("closed");
          kids.style.display = closed ? "none" : "";
        };
      }
    }
  })(sc.schema, document.getElementById("sctree"), "");
})();
// Results: the citing fields reassembled into a scoped extraction object,
// rendered as token-colored JSON lines like the main viewer's extract
// Results; leaf lines hover-highlight the matching schema rows.
(function () {
  const host = document.getElementById("fields");
  if (!(D.fields || []).length) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = "No stored extraction field cites this element.";
    host.appendChild(d);
    return;
  }
  const scoped = {};
  for (const f of D.fields) {
    let node = scoped;
    const parts = f.field.replace(/\[\d+\]/g, "").split(".");
    parts.forEach((key, i) => {
      if (i === parts.length - 1) node[key] = f.value;
      else node = node[key] = node[key] || {};
    });
  }
  const stack = [];
  for (const line of JSON.stringify(scoped, null, 2).split("\n")) {
    const div = document.createElement("div");
    div.className = "ex-json-line";
    host.appendChild(div);
    const key = line.match(/^\s*"((?:[^"\\]|\\.)*)"\s*:/);
    const opens = /[[{]\s*,?\s*$/.test(line);
    if (/^\s*[\]}]/.test(line)) stack.pop();
    if (key && !opens) div.dataset.path = [...stack, key[1]].join(".");
    if (opens && key) stack.push(key[1]);
    const rx = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)|(true|false|null)/g;
    let last = 0, m;
    while ((m = rx.exec(line)) !== null) {
      div.append(line.slice(last, m.index));
      const s = document.createElement("span");
      s.className = m[1] !== undefined ? (m[2] ? "j-key" : "j-str") : m[3] !== undefined ? "j-num" : "j-lit";
      s.textContent = m[1] !== undefined ? m[1] + (m[2] || "") : (m[3] !== undefined ? m[3] : m[4]);
      div.appendChild(s);
      last = rx.lastIndex;
    }
    div.append(line.slice(last));
    if (div.dataset.path) {
      const rows = () => [...document.querySelectorAll(".sc-row")].filter(r =>
        div.dataset.path === r.dataset.spath || div.dataset.path.startsWith(r.dataset.spath + "."));
      div.onmouseenter = () => rows().forEach(r => r.classList.add("hl"));
      div.onmouseleave = () => rows().forEach(r => r.classList.remove("hl"));
    }
  }
})();
</script>
