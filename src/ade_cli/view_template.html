   include fails (the artifact traveled without the store) the sidebar
   simply stays hidden; the document panes never depend on it.
   Injection posture: every store-controlled string (source names, models,
   ids) renders through textContent / .title — never innerHTML. */
(function () {
  const bar = document.getElementById("histbar");
  const itemsBox = document.getElementById("hb-items");
  const searchInput = document.getElementById("hb-search-input");
  const filterBtn = document.getElementById("hb-filterbtn");
  const badge = document.getElementById("hb-badge");
  const pop = document.getElementById("hb-pop");
  const SELF = DATA.job_item_id || (DATA.receipt && DATA.receipt.job_item_id);
  const SRC = DATA.history_src || "../../history.js";
  const POLL_MS = 3000;

  const state = {
    q: "",
    kinds: { parse: true, extract: true },
    date: "any", // any | day | week | month
    models: null, // null = all; else Set of allowed model versions
  };
  let items = [];
  let modelList = [];
  let everLoaded = false;

  // Time formatting per the Figma comp ("2m ago", "1h ago" — node 51:367):
  // the compact form of vision-agent-ui's formatDistanceToNow convention.
  function timeAgo(epochSeconds) {
    if (!epochSeconds) return "";
    const seconds = Math.max(0, Date.now() / 1000 - epochSeconds);
    if (seconds < 60) return "just now";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + "m ago";
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + "h ago";
    const days = Math.floor(hours / 24);
    if (days < 30) return days + "d ago";
    const months = Math.floor(days / 30);
    if (months < 12) return months + "mo ago";
    return Math.floor(months / 12) + "y ago";
  }

  // The comp shows the model family without its date pin ("dpt-3-pro");
  // the full resolved version stays on hover.
  function modelShort(version) {
    return (version || "").replace(/-\d{8}$/, "");
  }

  const DATE_CUTOFF = { day: 86400, week: 7 * 86400, month: 30 * 86400 };

  function passes(item) {
    if (state.q) {
      const name = (item.source_name || item.source || "").toLowerCase();
      if (!name.includes(state.q.toLowerCase())) return false;
    }
    if (!state.kinds[item.kind]) return false;
    if (state.date !== "any") {
      const t = item.completed_at || item.submitted_at;
      if (!t || Date.now() / 1000 - t > DATE_CUTOFF[state.date]) return false;
    }
    if (state.models !== null) {
      // Pending/failed items have no resolved model version yet, so they
      // have no checkbox in the Model section — the filter leaves them be.
      if (item.model_version && !state.models.has(item.model_version)) return false;
    }
    return true;
  }

  function activeFilterCount() {
    let n = 0;
    if (!state.kinds.parse || !state.kinds.extract) n++;
    if (state.date !== "any") n++;
    if (state.models !== null) n++;
    return n;
  }

  const STATUS = {
    parsed: ["complete", "complete"],
    extracted: ["complete", "complete"],
    markdown: ["complete", "complete"],
    pending: ["pending", "in progress"],
    failed: ["failed", "failed"],
    unreadable: ["failed", "failed"],
  };

  // The selected row follows what the viewer is showing, not just whose
  // artifact this page is: arriving via a referencing extract's deep link
  // (#extract=<id>) must highlight THAT extract row — its viewer IS this
  // parse item's page (decision 8), and highlighting the parse instead
  // reads as a mis-navigation.
  function currentId() {
    const m = location.hash.match(/extract=([^&]+)/);
    if (m) {
      const id = decodeURIComponent(m[1]);
      if (items.some(item => item.id === id)) return id;
    }
    return SELF;
  }

  function renderItems() {
    itemsBox.textContent = "";
    const current = currentId();
    const shown = items.filter(passes);
    if (!shown.length) {
      const empty = document.createElement("div");
      empty.className = "hb-empty";
      empty.textContent = everLoaded
        ? "No job items match."
        : "No job items yet.";
      itemsBox.appendChild(empty);
      return;
    }
    for (const item of shown) {
      const isCurrent = item.id === current;
      const failed = item.state === "failed" || item.state === "unreadable";
      // href is store-root-relative; null when nothing is renderable
      // (dangling ref). While collapsed, links carry #sb=c so the state
      // survives cross-page navigation (each viewer is its own document).
      const linkable = !isCurrent && item.viewer === "built" && !!item.href;
      const row = document.createElement(linkable ? "a" : "div");
      row.className =
        "hb-item" + (isCurrent ? " current" : "") + (failed ? " failed" : "");
      if (linkable) {
        const frag = stateFragment(true);
        row.href = "../../" + item.href + (
          frag.length
            ? (item.href.includes("#") ? "&" : "#") + frag.join("&")
            : ""
        );
      }

      const r1 = document.createElement("div");
      r1.className = "r1";
      const chip = document.createElement("span");
      chip.className = "hb-chip";
      chip.textContent = item.kind === "extract" ? "Extract" : "Parse";
      r1.appendChild(chip);
      const name = document.createElement("span");
      name.className = "hb-name";
      name.textContent = item.source_name || item.source || item.id;
      name.title = item.source || "";
      r1.appendChild(name);
      const [dotCls, statusLabel] = STATUS[item.state] || ["pending", item.state];
      const dot = document.createElement("span");
      dot.className = "hb-dot " + dotCls;
      dot.title = statusLabel;
      r1.appendChild(dot);
      row.appendChild(r1);

      // Meta line: `id · model · time` (credits stay out of the sidebar —
      // they live in each result panel's header), and for failed runs
      // `id · failed · reason` with the whole line red (node 51:437) —
      // never a separate failure row.
      const meta = document.createElement("div");
      meta.className = "hb-meta";
      const jid = document.createElement("span");
      jid.className = "jid";
      jid.textContent = item.short_id || item.id;
      jid.title = item.id; // hover reveals the full job item id
      meta.appendChild(jid);
      const parts = [];
      // The environment right after the id (before the model / the
      // failure), so mixed-environment stores read at a glance; older
      // items recorded no environment and render without the token.
      // Display labels compress the canonical names ("prod" for
      // production, "eu-prod" for eu); hover reveals the recorded name.
      const ENV_LABELS = { production: "prod", eu: "eu-prod" };
      if (item.environment)
        parts.push([ENV_LABELS[item.environment] || item.environment,
                    item.environment]);
      if (failed) {
        parts.push(["failed", null]);
        if (item.reason) parts.push([item.reason, null]);
      } else {
        if (item.stale)
          // Amber advisory, tooltip on hover — matches the extraction
          // panel's stale badge, never the failure red.
          parts.push(["stale", "The referenced parse was re-run (--force) " +
            "after this extraction: its evidence indexes the previous " +
            "parse run. Re-run ade extract to refresh it."]);
        if (item.model_version)
          parts.push([modelShort(item.model_version), item.model_version]);
        const ago = timeAgo(item.completed_at || item.submitted_at);
        if (ago) parts.push([ago, null]);
      }
      if (!isCurrent && item.viewer === "building") {
        parts.push(["building viewer…", null]);
      } else if (!isCurrent && item.viewer === "none" &&
                 (item.state === "parsed" || item.state === "extracted")) {
        row.title = "viewer not built yet — run: ade view " + (item.short_id || item.id);
      }
      for (const [part, hover] of parts) {
        meta.appendChild(document.createTextNode(" · "));
        const span = document.createElement("span");
        if (part === "building viewer…") span.className = "hb-building";
        if (part === "stale") span.className = "hb-stale";
        span.textContent = part;
        if (hover && hover !== part) span.title = hover;
        meta.appendChild(span);
      }
      row.appendChild(meta);
      itemsBox.appendChild(row);
    }
  }

  function renderBadge() {
    const n = activeFilterCount();
    badge.hidden = n === 0;
    badge.textContent = String(n);
  }

  // Collapsed-rail count: total store items, not the filtered view — the
  // filters' UI is invisible while collapsed, so a filtered number would
  // read as the store size and mislead.
  const countEl = document.getElementById("hb-count");
  function renderCount() {
    countEl.hidden = items.length === 0;
    countEl.textContent = String(items.length);
    countEl.title = items.length + " job item" + (items.length === 1 ? "" : "s");
  }

  function renderPop() {
    pop.textContent = "";
    const sec = (label) => {
      const d = document.createElement("div");
      d.className = "sec";
      d.textContent = label;
      pop.appendChild(d);
    };
    const check = (label, checked, onchange) => {
      const lab = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = checked;
      box.addEventListener("change", () => { onchange(box.checked); update(); });
      lab.appendChild(box);
      lab.appendChild(document.createTextNode(label));
      pop.appendChild(lab);
    };
    sec("Type");
    check("Parse", state.kinds.parse, v => { state.kinds.parse = v; });
    check("Extract", state.kinds.extract, v => { state.kinds.extract = v; });
    sec("Date");
    for (const [value, label] of [
      ["any", "Any time"], ["day", "Last 24 hours"],
      ["week", "Last 7 days"], ["month", "Last 30 days"],
    ]) {
      const lab = document.createElement("label");
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "hb-date";
      radio.checked = state.date === value;
      radio.addEventListener("change", () => { state.date = value; update(); });
      lab.appendChild(radio);
      lab.appendChild(document.createTextNode(label));
      pop.appendChild(lab);
    }
    if (modelList.length) {
      sec("Model");
      for (const model of modelList) {
        check(
          model,
          state.models === null || state.models.has(model),
          v => {
            const allowed = new Set(state.models === null ? modelList : state.models);
            if (v) allowed.add(model); else allowed.delete(model);
            state.models = allowed.size === modelList.length ? null : allowed;
          },
        );
      }
    }
    const clear = document.createElement("button");
    clear.className = "hb-clear";
    clear.textContent = "Clear filters";
    clear.addEventListener("click", () => {
      state.kinds = { parse: true, extract: true };
      state.date = "any";
      state.models = null;
      update();
    });
    pop.appendChild(clear);
  }

  function update() {
    syncHash();
    renderItems();
    renderBadge();
    renderCount();
    renderPop();
    if (!nameDrop.hidden) renderNameDrop(); // keep an open dropdown fresh
  }

  function absorb(payload) {
    items = (payload && payload.items) || [];
    const models = new Set();
    for (const item of items) if (item.model_version) models.add(item.model_version);
    modelList = Array.from(models).sort();
    // A previously-selected model that vanished from the store drops out.
    if (state.models !== null) {
      state.models = new Set(
        Array.from(state.models).filter(m => models.has(m)),
      );
      if (state.models.size === modelList.length) state.models = null;
    }
    everLoaded = true;
    if (bar.hidden) {
      // Unhiding the sidebar shifts the doc pane 260px — reanchor the
      // header overlays (pills, page navigator) deterministically here;
      // the ResizeObserver covers every other width change.
      bar.hidden = false;
      positionPills();
    }
    update();
  }

  function load() {
    const tag = document.createElement("script");
    // Cache-buster: file:// resolution ignores the query, the HTTP-style
    // cache key does not — each poll reads the current file.
    tag.src = SRC + "?t=" + Date.now();
    tag.addEventListener("load", () => {
      tag.remove();
      if (window.__ADE_HISTORY__) absorb(window.__ADE_HISTORY__);
    });
    tag.addEventListener("error", () => tag.remove()); // no store: stay hidden
    document.body.appendChild(tag);
  }

  // The chevron expands a dropdown of the store's document names, grouped
  // (one row per distinct name, with its run count); picking one applies it
  // as the search query.
  const nameDrop = document.getElementById("hb-namedrop");
  const searchToggle = document.getElementById("hb-search-toggle");

  function closeNameDrop() {
    nameDrop.hidden = true;
    searchToggle.setAttribute("aria-expanded", "false");
  }

  function applyQuery(q) {
    searchInput.value = q;
    state.q = q;
    syncHash();
    renderItems();
  }

  function renderNameDrop() {
    nameDrop.textContent = "";
    const groups = new Set(
      items.map(item => item.source_name || item.source || item.id),
    );
    const nameRow = (label, extraClass, onpick) => {
      const row = document.createElement("button");
      row.className = "hb-name-row" + (extraClass ? " " + extraClass : "");
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = label;
      nm.title = label;
      row.appendChild(nm);
      row.addEventListener("click", (e) => {
        e.stopPropagation();
        onpick();
        closeNameDrop();
      });
      nameDrop.appendChild(row);
    };
    nameRow("All documents", "all", () => applyQuery(""));
    for (const name of Array.from(groups).sort((a, b) => a.localeCompare(b))) {
      nameRow(name, "", () => applyQuery(name));
    }
  }

  searchToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    pop.classList.remove("open");
    if (nameDrop.hidden) {
      renderNameDrop();
      nameDrop.hidden = false;
      searchToggle.setAttribute("aria-expanded", "true");
    } else {
      closeNameDrop();
    }
  });
  nameDrop.addEventListener("click", e => e.stopPropagation());

  searchInput.addEventListener("input", () => {
    state.q = searchInput.value.trim();
    syncHash();
    renderItems();
  });
  filterBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    pop.classList.toggle("open");
    closeNameDrop();
  });
  pop.addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", () => {
    pop.classList.remove("open");
    closeNameDrop();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { pop.classList.remove("open"); closeNameDrop(); }
  });

  // Collapse/expand: the collapsed rail shows only the LandingAI mark and
  // this toggle. State rides in the URL hash (#sb=c) — each viewer is its
  // own document, so it's the one place the preference can travel.
  // Sidebar state (search, filters, collapse) rides in the URL hash —
  // each viewer is its own document, so the hash is the only place the
  // state can survive navigation. Row hrefs carry it forward; every
  // state change rewrites this page's own hash so reloads keep it too.
  function stateFragment(forHref) {
    const parts = [];
    if (bar.classList.contains("collapsed")) parts.push("sb=c");
    if (state.q) parts.push("q=" + encodeURIComponent(state.q));
    if (!(state.kinds.parse && state.kinds.extract)) {
      parts.push("ft=" + ["parse", "extract"].filter(k => state.kinds[k]).join(","));
    }
    if (state.date !== "any") parts.push("fd=" + state.date);
    if (state.models !== null) {
      parts.push("fm=" + Array.from(state.models).map(encodeURIComponent).join(","));
    }
    if (FILE_MODE && Math.abs(zoom - 1) > 0.001) parts.push("z=" + zoom);
    if (FILE_MODE && forHref) {
      // The native-zoom baseline this page renders under — carried in
      // ROW HREFS ONLY, z= or not. Chrome's menu zoom is invisible to the
      // page as an event (nothing to intercept, no API to read or set it)
      // and never survives a file:// hop on its own; but it scales
      // devicePixelRatio, so the next viewer divides this value by its
      // own DPR and mirrors the difference as CSS zoom — a menu-zoomed
      // 150% page hands its LOOK to the next document.
      //
      // Never in the page's OWN hash: Chrome keys file:// zoom by the
      // full URL INCLUDING the fragment, so rewriting our hash when
      // native zoom changes hands Chrome a new zoom key mid-gesture and
      // it re-applies whatever stale level that key last stored — a
      // menu-zoom click then visibly fights itself (110 → 150 → 110).
      //
      // Served pages (ade view --serve) never stamp z=/dpr=: browser zoom
      // is per-origin there, so every sibling viewer shares it natively.
      parts.push("dpr=" + Math.round(devicePixelRatio * 10000) / 10000);
    }
    return parts;
  }

  // Page zoom, viewer-owned — but ONLY from file://. Over an http origin
  // (ade view --serve) browser zoom is per-origin: one native zoom covers
  // every sibling viewer, survives hops, reloads and restarts, and the
  // browser's zoom indicator stays truthful — everything below exists to
  // approximate that on file://, where zoom is keyed per URL and nothing
  // survives a hop. There, browser zoom can neither be read nor restored
  // across documents from JS, so ⌘/Ctrl +/-/0 and the ctrl+wheel pinch are
  // intercepted into a CSS zoom on <body> that rides in the hash (#z=)
  // like the sidebar state — row hrefs carry it to the next viewer,
  // replaceState keeps it across reloads. Zoom from the browser's menu
  // stays native (not interceptable) and is carried as a dpr= baseline
  // instead (stateFragment). The ladder mirrors Chrome's zoom stops.
  const FILE_MODE = location.protocol === "file:";
  const ZOOM_LADDER = [0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3];
  let zoom = 1;
  // A human zoom gesture closes the post-load settle window (restoreState):
  // once the user has zoomed this page themselves, the scale is theirs and
  // the carried baseline must stop correcting it.
  let userZoomed = false;
  // Feature gate: without working CSS zoom (old Firefox) there is no
  // replacement to offer, so the native shortcuts must stay untouched —
  // never preventDefault what we can't substitute.
  const zoomSupported =
    typeof CSS !== "undefined" && CSS.supports && CSS.supports("zoom", "2");
  function applyZoom(next) {
    zoom = Math.round(Math.min(3, Math.max(0.5, next)) * 10000) / 10000;
    if (Math.abs(zoom - 1) < 0.005) zoom = 1; // snap float noise to clean 1
    document.body.style.zoom = zoom === 1 ? "" : String(zoom);
    syncHash();
    renderItems(); // row hrefs carry the state forward
  }
  function stepZoom(dir) {
    userZoomed = true; // only gestures step — settle correction never does
    const idx = ZOOM_LADDER.findIndex(l => Math.abs(l - zoom) < 0.001);
    const next = idx >= 0
      ? ZOOM_LADDER[Math.min(ZOOM_LADDER.length - 1, Math.max(0, idx + dir))]
      // Off-ladder (a hand-edited hash): snap to the nearest rung.
      : (dir > 0
          ? ZOOM_LADDER.find(l => l > zoom) ?? 3
          : [...ZOOM_LADDER].reverse().find(l => l < zoom) ?? 0.5);
    applyZoom(next);
  }
  if (zoomSupported && FILE_MODE) {
    document.addEventListener("keydown", (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
      if (e.key === "=" || e.key === "+") { e.preventDefault(); stepZoom(1); }
      else if (e.key === "-") { e.preventDefault(); stepZoom(-1); }
      else if (e.key === "0") { e.preventDefault(); userZoomed = true; applyZoom(1); }
    });
    // Pinch gestures arrive as ctrl-wheel bursts; always claim the event
    // so the browser never zooms between our throttled steps.
    let lastWheelZoom = 0;
    document.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const now = Date.now();
      if (now - lastWheelZoom < 80) return;
      lastWheelZoom = now;
      stepZoom(e.deltaY < 0 ? 1 : -1);
    }, { passive: false });
  }
  // Keep the carried dpr= fresh (file:// only — served hrefs carry none):
  // a View-menu (native) zoom after load changes devicePixelRatio, and row
  // hrefs stamped with the old value would mis-correct on the next page.
  // matchMedia is the one reliable DPR-change signal; it matches a fixed
  // value, so re-arm per change. Refresh the hrefs ONLY — never syncHash()
  // here: rewriting our own hash in reaction to a native zoom change
  // churns Chrome's per-URL file:// zoom key and re-applies stale levels
  // (see stateFragment).
  (function watchDpr() {
    if (!FILE_MODE) return;
    const mq = matchMedia(`(resolution: ${devicePixelRatio}dppx)`);
    const onChange = () => { renderItems(); watchDpr(); };
    if (mq.addEventListener) {
      mq.addEventListener("change", onChange, { once: true });
    } else if (mq.addListener) {
      // Safari ≤13 ships only the deprecated MediaQueryList.addListener;
      // calling addEventListener there throws at load and would take the
      // whole sidebar down with it.
      const once = () => { mq.removeListener(once); onChange(); };
      mq.addListener(once);
    }
  })();

  function syncHash() {
    // Preserve non-sidebar anchors (element=, extract=); replace ours.
    const kept = location.hash.replace(/^#/, "").split("&")
      .filter(p => p && !/^(sb|q|ft|fd|fm|z|dpr)=/.test(p));
    const parts = kept.concat(stateFragment());
    // replaceState: no history spam, and it never fires hashchange (which
    // would re-render for a state we just rendered).
    history.replaceState(
      null, "",
      location.pathname + location.search + (parts.length ? "#" + parts.join("&") : ""));
  }

  function setCollapsed(collapsed) {
    bar.classList.toggle("collapsed", collapsed);
    pop.classList.remove("open");
    closeNameDrop();
    syncHash();
    renderItems(); // row hrefs carry the state forward
  }
  document.getElementById("hb-toggle").addEventListener("click", (e) => {
    e.stopPropagation(); // don't bubble into the rail's expand-on-click
    setCollapsed(true);
  });
  // VUI GlobalSidebarV3: the whole collapsed rail expands on click (the
  // hover-revealed expand button included — its click bubbles here).
  bar.addEventListener("click", () => {
    if (bar.classList.contains("collapsed")) setCollapsed(false);
  });
  // Restore the sidebar state a navigation carried here (search text,
  // filters, collapse) before the first data render.
  (function restoreState() {
    const raw = (k) => {
      const m = location.hash.match(new RegExp("[#&]" + k + "=([^&]*)"));
      return m ? m[1] : null;
    };
    const q = raw("q");
    if (q) {
      state.q = decodeURIComponent(q);
      searchInput.value = state.q;
    }
    const ft = raw("ft");
    if (ft !== null) {
      const on = new Set(ft.split(",").filter(Boolean));
      state.kinds = { parse: on.has("parse"), extract: on.has("extract") };
    }
    const fd = raw("fd");
    if (fd === "day" || fd === "week" || fd === "month") state.date = fd;
    const fm = raw("fm");
    if (fm !== null) {
      state.models = new Set(
        fm.split(",").filter(Boolean).map(decodeURIComponent));
    }
    // Read every carried value BEFORE applying any: applyZoom and
    // setCollapsed both syncHash(), which rewrites the hash from the
    // state applied so far — a flag read after that rewrite is gone.
    const z = parseFloat(raw("z") ?? "");
    const dpr = parseFloat(raw("dpr") ?? "");
    if (/[#&]sb=c(&|$)/.test(location.hash)) {
      // Arriving already-collapsed: apply without replaying the shrink.
      bar.classList.add("no-anim");
      setCollapsed(true);
      setTimeout(() => bar.classList.remove("no-anim"), 50);
    }
    // Served over an origin, zoom is the browser's own (per-origin native)
    // — carried z=/dpr= only appears here via a link minted on file:// and
    // is meaningless; strip it and let the origin zoom stand.
    if (!FILE_MODE) {
      if (!isNaN(z) || !isNaN(dpr)) syncHash();
      return;
    }
    // Native-baseline correction (see stateFragment): the previous
    // page's devicePixelRatio over ours is exactly the relative native
    // zoom, so the carried state lands at the same VISUAL scale it had
    // there — including a menu-zoomed page that carried no z= at all.
    const base = isNaN(z) ? 1 : z;
    const ratio = !isNaN(dpr) && dpr > 0 ? dpr / devicePixelRatio : 1;
    if (Math.abs(base * ratio - 1) > 0.001) {
      applyZoom(base * ratio); // syncHash()s to local truth internally
    } else if (!isNaN(dpr) || !isNaN(z)) {
      // Same-baseline hop: nothing to zoom, but the carried z=/dpr= must
      // still leave our own URL — a dangling #dpr= is a live per-fragment
      // Chrome zoom key, exactly what stateFragment works to avoid.
      syncHash();
    }
    // The correction above is one-shot, but Chrome applies a remembered
    // per-URL native zoom ASYNCHRONOUSLY — the issue-#61 trace shows it
    // landing ~15ms AFTER the syncHash above, because that rewrite flips
    // this document's file:// zoom key onto the very URL the stale level
    // was stored under (a page menu-zoomed at a bare URL leaves 110%
    // parked on that key forever). So a DPR move in the first moments
    // after load is Chrome restoring a stored level, not a human reaching
    // the View menu — re-run the same baseline math against the fresh DPR
    // so the page keeps the visual scale it arrived with. The user's own
    // gestures close the window early (the scale is theirs from then on),
    // and a correction can itself flip the zoom key again, so keep
    // watching until the deadline. Landings without a carried dpr= have
    // no baseline to hold — the window never opens for them.
    if (!isNaN(dpr) && dpr > 0 && zoomSupported) {
      const arrivedVisual = base * dpr; // display-invariant: CSS zoom × DPR
      const deadline = Date.now() + 1500;
      (function settle() {
        const mq = matchMedia(`(resolution: ${devicePixelRatio}dppx)`);
        const onChange = () => {
          if (Date.now() > deadline || userZoomed) return;
          applyZoom(arrivedVisual / devicePixelRatio);
          settle();
        };
        if (mq.addEventListener) {
          mq.addEventListener("change", onChange, { once: true });
        } else if (mq.addListener) {
          // Safari ≤13 (see watchDpr above).
          const once = () => { mq.removeListener(once); onChange(); };
          mq.addListener(once);
        }
      })();
    }
  })();

  load();
  // Poll unconditionally: a local-file read every few seconds costs nothing,
  // and browsers already throttle background-tab timers. Refresh immediately
  // on return so a backgrounded tab never shows stale statuses.
  setInterval(load, POLL_MS);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) load();
  });
  // Same-page deep-link navigation (clicking an extract row of this parse)
  // moves the selection without a reload.
  window.addEventListener("hashchange", renderItems);
})();
</script>
</body>
</html>
