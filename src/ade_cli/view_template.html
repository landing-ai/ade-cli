  .boxlabel {

    font-size: 10.5px; padding: 0 5px; border-radius: 3px;
    background: var(--c); color: #fff; display: none; z-index: 4;
  }
  .box:hover > .boxlabel, .box.sel > .boxlabel, .box.hov > .boxlabel { display: block; }

  /* ── Parse toolbar — VUI ProjectParseTab.tsx:351 */
  #toolbar {
    z-index: 20; display: flex; width: 100%; flex-shrink: 0; align-items: center;
    justify-content: space-between; border-bottom: 1px solid var(--border-subtle);
    padding: 12px 12px 8px;
  }
  /* FormatToggle segmented control — VUI ProjectParseTab.tsx:655-693 */
  .format-toggle { display: inline-flex; align-items: center; border-radius: 6px; background: var(--bg-subtle); }
  .format-toggle button {
    display: flex; align-items: center; border-radius: 6px; padding: 6px 8px;
    border: 1px solid transparent; transition: background-color .15s;
  }
  .format-toggle button.active { border-color: var(--border-subtle); background: var(--bg-main); }
  .format-toggle .seg-label { padding: 0 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-primary); }
  .toolbar-right { display: flex; align-items: center; gap: 8px; }
  .toolbar-group { display: flex; align-items: center; gap: 4px; }
  .divider { height: 24px; width: 0; border-right: 1px solid var(--border-subtle); } /* VUI ProjectParseTab.tsx:531 */
  /* Model chip — Figma 130:357: ghost, 24px, r4, pad 4; label Inter 500
     12/16 #1A1916 with 4px side padding. Informational: hover = full
     resolved model version. */
  .model-chip { display: flex; align-items: center; height: 24px; padding: 4px; border-radius: 4px; cursor: help; }
  .model-chip:hover { background: var(--bg-subtlest); }
  .model-chip .model-label { padding: 0 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-primary); white-space: nowrap; }
  .credits { white-space: nowrap; font-size: 12px; font-weight: 500; line-height: 16px; color: var(--text-tertiary); }
  .credits b { font-weight: 500; color: var(--text-secondary); }
  .icon-btn {
    display: flex; width: 28px; height: 28px; align-items: center; justify-content: center;
    border-radius: 4px; color: var(--text-primary); transition: background-color .15s;
  }
  .icon-btn:hover { background: var(--bg-main-hovered); }
  svg.i { width: 16px; height: 16px; }

  /* Eye popover — VUI DisplaySettingsDropdown.tsx:96-116 (w-[338px]) */
  #eyewrap { position: relative; }
  #eyepop {
    position: absolute; right: 0; top: calc(100% + 6px); width: 338px; z-index: 40;
    border: 1px solid var(--border-subtle); background: var(--bg-main);
    border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.08); padding: 12px;
    display: none; flex-direction: column; gap: 8px;
  }
  #eyepop.open { display: flex; }
  #eyepop .section { font-size: 12px; font-weight: 500; line-height: 16px; color: var(--text-tertiary); }
  #eyepop .row { display: flex; align-items: center; gap: 12px; }
  #eyepop .grow { display: flex; flex: 1; flex-direction: column; }
  #eyepop .title { font-size: 12px; font-weight: 600; line-height: 16px; color: var(--text-primary); }
  #eyepop .desc { font-size: 12px; line-height: 16px; color: var(--text-tertiary); }
  .switch { position: relative; width: 28px; height: 16px; border-radius: 999px; background: var(--warm-green-300); transition: background .15s; flex-shrink: 0; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--warm-green-700); } /* VUI DisplaySettingsDropdown.tsx:113 */
  .switch.on::after { left: 14px; }

  /* ── Markdown pane — VUI Dpt3ChunksMarkdown.tsx:242-315: rows are
     `mb-4 rounded p-2` cards with a floating capitalized label at
     -top-3; default no box, hover = 1px color border + color1A fill,
     selected = border only (reads cleaner than hover). */
  #content { min-height: 0; flex: 1; overflow: auto; padding: 16px 8px 8px; font-size: 14px; }
  .mdrow {
    position: relative; margin-bottom: 16px; padding: 8px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer;
  }
  /* Bring-your-own-markdown items: the input rendered whole, no element
     tiling, no hover affordances. */
  .mdwhole { padding: 8px; }
  .mdrow.hov { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .mdrow.sel { border-color: var(--c); background: transparent; }
  .mdlabel {
    position: absolute; top: -12px; left: 8px; border-radius: 2px;
    border: 2px solid transparent; padding: 0 4px; font-size: 12px;
    line-height: 1.4; text-transform: capitalize; color: var(--text-tertiary);
    background: transparent; white-space: nowrap;
  }
  .mdrow.hov .mdlabel { color: var(--c); }
  .mdrow.sel .mdlabel { background: var(--c); border-color: var(--c); color: #fff; }
  /* Page separator between rows when the page changes —
     VUI Dpt3ChunksMarkdown.tsx:267-269 */
  .pagesep { border: 0; border-top: 1px solid #b0cdae; margin: 16px 0 32px; }
  /* Region-divided rows: one continuous <p>, one span per tile segment;
     highlight = color at 0x33 alpha, box-decoration-clone, rounded 2px —
     VUI Dpt3ChunksMarkdown.tsx:355-415 (the 2026-07-15 highlight fix). */
  .mdrow p.regions { white-space: pre-line; margin: 0; }
  span.region { box-decoration-break: clone; -webkit-box-decoration-break: clone; border-radius: 2px; cursor: pointer; background: transparent; }
  span.region.hov, span.region.sel { background: color-mix(in srgb, var(--c) 20%, transparent); }
  /* Plain markdown body (mini renderer output) */
  .mdbody { cursor: pointer; }
  .mdbody p, .mdbody div.rawhtml { margin: 0 0 8px; white-space: pre-line; } /* VUI MemoizedReactMarkdown.tsx:276 */
  .mdbody h1, .mdbody h2, .mdbody h3, .mdbody h4 { margin: 4px 0 8px; line-height: 1.3; }
  .mdbody ul { margin: 0 0 8px; padding-left: 22px; }
  .mdbody code { background: var(--bg-subtle); border-radius: 3px; padding: 0 4px; font-size: 13px; }
  .mdbody a { color: #3b82f6; } .mdbody a:hover { text-decoration: underline; } /* MemoizedReactMarkdown.tsx:319-325 */
  .mdbody figure { margin: 0 0 8px; white-space: pre-line; }
  .mdbody > :last-child, .mdrow p.regions { margin-bottom: 0; } /* row spacing comes from mb-4 (VUI [&_p]:mb-0) */
  /* Tables — VUI MemoizedReactMarkdown.tsx:326-401 + buildDpt3TableHtml */
  table.cells { width: 100%; border-collapse: collapse; margin: 8px 0 4px; }
  table.cells td {
    border: 1px solid var(--border-subtle); padding: 3px 8px; cursor: pointer; --c: #2193FD;
    font-size: 13px;
  }
  table.cells td.hov { background: color-mix(in srgb, var(--c) 12%, transparent); }
  /* Selected cell: colored border + color33 fill — VUI
     MemoizedReactMarkdown.tsx:333-401 (td override). */
  table.cells td.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 20%, transparent); }

  /* JSON view — VUI Dpt3RawJsonView.tsx:289-292 (container) +
     ReadOnlyJsonView.tsx (fontSize 13, lineHeight 20, no line numbers,
     light "vs" theme colors). */
  #jsonview {
    display: none; flex: 1; min-height: 0; margin: 0;
    border-radius: 5px; border: 1px solid var(--border-subtle);
    background: var(--bg-subtlest); padding: 8px 12px; overflow: auto;
    font: 13px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre;
  }
  /* Monaco "vs" theme JSON tokens (monaco-editor themes.js: string.key.json
     A31515, string.value.json / keyword.json 0451A5, number 098658). */
  .j-key { color: #a31515; } .j-str { color: #0451a5; } .j-num { color: #098658; }
  .j-lit { color: #0451a5; }
  /* Per-element block highlight — the static take on Dpt3RawJsonView's
     Monaco overlay (Dpt3RawJsonView.tsx:302-339): hover = color0D fill +
     color1A border, selected = color1A fill + solid color border. */
  /* inline-block so the whole element object paints one rectangle (like
     Monaco's overlay), not a per-line ladder; inner indentation is written
     relative to the block for exactly this reason. */
  .jblock { display: inline-block; vertical-align: top; cursor: pointer; }
  .jblock.hov { background: color-mix(in srgb, var(--c) 5%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 10%, transparent); }
  .jblock.sel { background: color-mix(in srgb, var(--c) 10%, transparent);
    box-shadow: 0 0 0 1px var(--c); }

  /* ── Extract tab — VUI ProjectExtractTab.tsx:958-1114: a horizontal
     50/50 split, Results LEFT, Schema RIGHT (Allotment defaultSizes
     [50,50] at :1039; fixed split here). */
  #extract { display: none; min-height: 0; flex: 1; overflow: hidden; }
  .ex-split { display: flex; flex-direction: row; height: 100%; width: 100%; flex: 1; min-width: 0; }
  .ex-scroll { min-width: 0; }
  .ex-results { display: flex; flex: 1; min-width: 0; flex-direction: column; border-right: 1px solid var(--border-subtle); }
  .ex-schema { display: flex; flex: 1; min-width: 0; flex-direction: column; }
  /* Panel headers — ProjectExtractionResults.tsx:68 / SchemaVersionSelector.tsx:70.
     min-height pins them to the Parse toolbar's computed height (28px
     toggle + 2px borders + 12/8 padding + 1px border = 51px) so switching
     workflow pills never shifts the header band. */
  .ex-panel-head {
    display: flex; flex-shrink: 0; align-items: center; gap: 6px;
    border-bottom: 1px solid var(--border-subtle); padding: 8px 16px;
    min-height: 51px;
  }
  .ex-panel-head .ptitle { font-size: 15px; font-weight: 600; line-height: 20px; color: var(--text-primary); }
  /* Credits sit at the header's right edge, mirroring the Parse toolbar. */
  .ex-panel-head .credits { margin-left: auto; }
  .ex-panel-head select {
    font: 12px/1.3 inherit; color: var(--text-secondary); background: var(--bg-main);
    border: 1px solid var(--border-subtle); border-radius: 4px; padding: 4px 6px;
  }
  .ex-scroll { min-height: 0; flex: 1; overflow: auto; }
  /* Partial-extraction warning (#118) — an amber ⚠️ beside the Results
     title; hover reveals the messages. Palette follows the playground's
     Schema Validation Error toast (bg-amber-50, ring-amber-200) and the
     stale badge. */
  .ex-warn { position: relative; display: inline-flex; align-items: center; font-size: 13px; cursor: default; }
  /* The 6px visual gap is transparent PADDING on the (hover-tracked)
     tooltip container, never empty space between elements — crossing it
     keeps :hover alive, so the message stays put to be selected and
     copied. The delayed visibility flip is a grace period for a cursor
     that briefly strays off the corridor. */
  .ex-warn .ex-warn-tip {
    position: absolute; top: 100%; left: -8px; z-index: 40;
    padding-top: 6px; width: 360px; max-width: 60vw;
    visibility: hidden; opacity: 0;
    transition: opacity .12s ease, visibility 0s linear .3s;
  }
  .ex-warn:hover .ex-warn-tip { visibility: visible; opacity: 1; transition-delay: 0s; }
  .ex-warn-box {
    padding: 8px 10px; border-radius: 6px;
    border: 1px solid #f4e9c5; background: #fefdf0; color: #a15c07;
    font-size: 12px; line-height: 16px; white-space: pre-wrap;
    box-shadow: 0 4px 12px rgba(16,24,40,.12); cursor: text;
  }
  .ex-warn-box b { font-weight: 600; }
  .ex-warn-box div + div { margin-top: 6px; }
  /* Collapsible sections — ExtractedDataJSONView.tsx:491 ("Extraction",
     default open :195) and :690 ("Extract Metadata", default closed :680). */
  .ex-section { border: 1px solid var(--border-subtle); border-bottom: 0; background: var(--bg-subtlest); overflow: hidden; }
  .ex-section:last-child { border-bottom: 1px solid var(--border-subtle); }
  .ex-sec-head { display: flex; height: 24px; align-items: center; gap: 4px; cursor: pointer; border-bottom: 1px solid var(--border-subtle); padding: 0 12px; font-size: 12px; font-weight: 500; color: var(--text-primary); }
  .ex-sec-head .chev { transition: transform .15s; font-size: 10px; color: var(--text-tertiary); }
  .ex-section.open .ex-sec-head .chev { transform: rotate(90deg); }
  /* Section BODY is white like the playground: VUI's expanded body is the
     Monaco editor (vs theme background #fffffe — ReadOnlyJsonView.tsx, no
     app override) and its mobile branch inherits bg-main; only the section
     container + header carry bg-subtlest (ExtractedDataJSONView.tsx:491). */
  .ex-sec-body { display: none; background: var(--bg-main); }
  .ex-section.open .ex-sec-body { display: block; }
  /* JSON lines — the static model is VUI's own non-Monaco branch
     (ExtractedDataJSONView.tsx:446-486): a <pre> of clickable line divs;
     hover/selected line = border-l-2 #12B76A + rgba(18,183,106,.1/.15)
     (the Monaco overlays at :539-557 use the same colors). */
  /* margin: 0 kills the <pre> UA default (1em 0), which opened a gap band
     of section bg-subtlest around the white body. VUI has no such band:
     Tailwind preflight zeroes pre margins (mobile branch), and the Monaco
     body sits flush under the header — its +12px content-height fudge
     (ExtractedDataJSONView.tsx:527,707) is this 6px top+bottom padding. */
  .ex-json { margin: 0; font: 13px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; padding: 6px 0; overflow-x: auto; }
  .ex-line { position: relative; height: 20px; padding: 0 16px 0 12px; border-left: 2px solid transparent; }
  .ex-line[data-path] { cursor: pointer; }
  .ex-line[data-path]:hover, .ex-line.hovline { border-left-color: #12B76A; background: rgba(18,183,106,.1); }
  .ex-line.sel { border-left-color: #12B76A; background: rgba(18,183,106,.15); }
  /* Inline right-side labels — ExtractedDataJSONView.tsx:583-611 */
  .ex-line .linelabel { position: absolute; right: 16px; top: 0; font-size: 12px; font-style: italic; color: var(--text-tertiary); pointer-events: none; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: var(--bg-highlight); color: var(--text-secondary); }
  .badge.stale { background: #fefdf0; color: #a15c07; cursor: help; }
  /* Schema tree — read-only SchemaTreeEditor.tsx rows (:462-486): name +
     colored type badge on one row, description on its own row below;
     children indent 16px (:337); highlight bg-green-400/10 on path
     prefixes (:311-315,:348). */
  .sc-tree { padding: 12px 16px 12px 8px; }
  .sc-row { position: relative; padding: 5px 12px 5px 32px; border-radius: 4px; }
  .sc-row:hover { background: var(--bg-subtlest); }
  .sc-row.hl { background: rgba(74,222,128,.1); }
  /* Expand/collapse chevron — a real toggle (SchemaTreeEditor.tsx:383-404):
     expanded = rotate-90, with the same transition. */
  .sc-row .schevbtn { position: absolute; left: 16px; top: 9px; display: flex; width: 16px; height: 16px; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); }
  .sc-row .schevbtn svg { width: 12px; height: 12px; transform: rotate(90deg); transition: transform .15s; }
  .sc-row.closed .schevbtn svg { transform: rotate(0deg); }
  .sc-row .srow1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sc-row .sname { padding: 2px 4px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
  /* Type badges — getTypeBadgeClasses (SchemaTreeEditor.tsx:205-215) with
     the accent tokens from globals.css. */
  .sc-row .stype { display: inline-flex; align-items: center; border-radius: 5px; padding: 2px 8px; font-size: 12px; font-weight: 500; color: var(--text-primary); border: 1px solid; }
  .stype.t-object  { background: #ecfdf3; border-color: #d1fadf; }
  .stype.t-string  { background: #fefbe8; border-color: #fef7c3; }
  .stype.t-number  { background: #f4f3ff; border-color: #ebe9fe; }
  .stype.t-boolean { background: #fef3f2; border-color: #fee4e2; }
  .stype.t-enum    { background: #ebf7ff; border-color: #def3ff; }
  .sc-row .sdesc { padding: 0 4px; font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc-kids { margin-left: 16px; }
  /* Evidence layer: the shown extraction's grounded boxes stay lit (#10) —
     outlined and tinted at rest whatever the eye toggle says (VUI's extract
     line-level mode likewise paints referenced sub-boxes at rest; the
     body.show-fine selector out-specifies the parent fill-clear rule). */
  .box.evid, body.show-fine .box.evid { display: block; background: color-mix(in srgb, var(--c) 8%, transparent); }
  .box.sub.evid { box-shadow: inset 0 0 0 1px var(--c); }
  /* While a selection exists, non-selected boxes fade to opacity 0 but
     STAY in the DOM and hoverable — VUI DocExtractionAnnotationsDpt3.tsx:
     153,181-183 (`opacity-0 transition-opacity` + `show && 'opacity-100'`
     where show includes isHovered): mousing over a hidden chunk's area
     brings it back. .reveal (the selected parent's own sub-boxes) stays. */
  body.has-selection #pages .box:not(.sel):not(.hov):not(.reveal):not(:hover) { opacity: 0; }

  @keyframes ade-flash {
    0%, 60% { outline: 3px solid #f79009; outline-offset: 2px; }
    100% { outline: 3px solid transparent; outline-offset: 2px; }
  }
  .flash { animation: ade-flash 1.6s ease-out 2; }
</style>

function positionPills() {
  // VUI client.tsx:435-437 — pills sit at the doc-pane width.
  const docWidth =
    document.getElementById("docpane").getBoundingClientRect().width;
  document.getElementById("pills").style.left = docWidth + "px";
  // Page navigator — Figma 46:1096: right-aligned inside the doc pane's
  // header, 16px from the pane's right edge.
  const pagination = document.getElementById("pagination");

// Reposition on ANY doc-pane width change — the sidebar appearing after
// history.js loads, sash drags, window resizes. The initial-load call
// alone measured the pane before the sidebar unhid and stuck the
// navigator ~260px off until the next sash drag.

function switchTab(tab) {

    p.classList.toggle("active", p.dataset.tab === tab));
  document.getElementById("parse-tab").style.display = tab === "parse" ? "flex" : "none";
  document.getElementById("extract").style.display = tab === "extract" ? "flex" : "none";
  if (tab === "extract" && !shownExtract && (DATA.extractions || []).length) {
    buildExtract(DATA.extractions[0].job_item_id);

/* ── Split panes: drag the sash; VUI Allotment defaults 33% / 300 / 400 ── */
(function sash() {
  const sash = document.getElementById("sash");
  const doc = document.getElementById("docpane");
  sash.addEventListener("pointerdown", down => {
    down.preventDefault();
    sash.setPointerCapture(down.pointerId);
    document.body.classList.add("resizing");
    const move = ev => {
      const total = document.querySelector("main").getBoundingClientRect();
      const width = Math.min(Math.max(ev.clientX - total.left, 300), total.width - 400);
      doc.style.width = width + "px";
      positionPills();
    };
    const up = () => {
      document.body.classList.remove("resizing");
      sash.removeEventListener("pointermove", move);
      sash.removeEventListener("pointerup", up);
    };
    sash.addEventListener("pointermove", move);
    sash.addEventListener("pointerup", up);
  });
  window.addEventListener("resize", positionPills);
})();

/* ── Document pane: page stack + overlay ─────────────────────────────── */
function boxNode(id, type, box, cls, label) {
  const b = el("div", "box " + (cls || ""));
  b.dataset.id = id;
  b.dataset.type = type;
  b.style.setProperty("--c", color(type));
  b.style.left = box.xmin * 100 + "%";
  b.style.top = box.ymin * 100 + "%";
  b.style.width = (box.xmax - box.xmin) * 100 + "%";
  b.style.height = (box.ymax - box.ymin) * 100 + "%";
  if (label) el("span", "boxlabel", b).textContent = label;
  return b;
}

(function pages() {
  const pane = document.getElementById("pages");
  // Lazy page imagery: view.html embeds only the head pages; every other
  // page loads on demand from pages-N.js sidecar chunks in the store (a
  // JSONP include — the same file:// trick as history.js). Light extract
  // viewers embed nothing and borrow every chunk from their parse item,
  // so a document's imagery is stored once however many extractions cite
  // it. A chunk the background builder hasn't rendered yet retries with a
  // cache-buster; one that never appears degrades to an honest notice.
  const deferred = new Map(); // page number -> placeholder node
  const chunks = (DATA.page_chunks || []).map(c => ({ ...c, state: "idle", tries: 0 }));
  const chunkOfPage = new Map();
  for (const chunk of chunks) for (const p of chunk.pages) chunkOfPage.set(p, chunk);
  const RETRY_MS = 5000, MAX_TRIES = 24; // ~2min: covers a long background render
  // When the borrow fails, say WHAT broke, WHY it usually happens, and HOW
  // to fix it — a banner for the story, short per-page placeholders.
  const imageryNotice = (text) => {
    const banner = document.getElementById("notebanner");
    banner.textContent = banner.textContent
      ? banner.textContent + "  ·  " + text : text;
    banner.hidden = false;
  };
  let noticeShown = false;
  const chunkFailed = (chunk) => {
    chunk.state = "failed";
    for (const num of chunk.pages) {
      const placeholder = deferred.get(num);
      if (!placeholder) continue;
      placeholder.textContent =
        "page " + num + " — image unavailable (see the notice above)";
      deferred.delete(num);
    }
    if (noticeShown) return;
    noticeShown = true;
    imageryNotice(DATA.kind === "extract"
      ? "Page images unavailable: this extract viewer keeps no images of " +
        "its own — it loads them from its parse job item (" + chunk.src +
        "), which could not be loaded. This usually means " +
        "the file was opened outside its ~/.ade/jobs/" + DATA.job_item_id +
        "/ folder (images don't travel with a copied file), or the parse " +
        "job item was deleted. To fix: open the viewer from its original " +
        "store location, or re-run `ade view " + DATA.job_item_id +
        "` to re-render the imagery. To share a viewer with images " +
        "included, share the parse job item's view.html instead. " +
        "Extraction results, markdown, and box data below are unaffected."
      : "Some page images could not be loaded (" + chunk.src + "). Pages " +
        "beyond the embedded head load from sidecar files in the store, " +
        "so this usually means the file was opened outside its " +
        "~/.ade/jobs/ folder, or the imagery hasn't rendered yet. Re-run " +
        "`ade view " + DATA.job_item_id + "` with the source present to " +
        "re-render it. Markdown, elements, and box data are unaffected.");
  };
  const fillFromStore = (chunk) => {
    const imagery = (window.__ADE_PAGES__ || {})[DATA.pages_key] || {};
    for (const num of chunk.pages) {
      const placeholder = deferred.get(num);
      if (!placeholder) continue;
      const data = imagery[String(num)];
      if (!data || !data.data_uri) {
        // The chunk loaded but skipped this page (absent from the source).
        placeholder.textContent = "page " + num + " — no image in the sidecar";
        deferred.delete(num);
        continue;
      }
      const img = document.createElement("img");
      img.src = data.data_uri;
      img.width = data.width;
      img.height = data.height;
      img.alt = "page-" + num;
      placeholder.replaceWith(img);
      deferred.delete(num);
    }
  };
  const loadChunk = (chunk) => {
    if (!chunk || chunk.state !== "idle") return;
    chunk.state = "loading";
    const attempt = () => {
      const tag = document.createElement("script");
      // Cache-buster: the background builder may have just written the
      // file; file:// resolution ignores the query, the cache key doesn't.
      tag.src = chunk.src + "?t=" + Date.now();
      tag.addEventListener("load", () => {
        tag.remove();
        chunk.state = "done";
        fillFromStore(chunk);
      });
      tag.addEventListener("error", () => {
        tag.remove();
        chunk.tries++;
        if (chunk.tries >= MAX_TRIES) { chunkFailed(chunk); return; }
        setTimeout(attempt, RETRY_MS); // likely still rendering; keep waiting
      });
      document.body.appendChild(tag);
    };
    attempt();
  };
  for (const p of DATA.pages) {
    const page = el("div", "page", pane);
    page.dataset.page = p.page;
    if (p.image) {
      const img = el("img", "", page);
      img.src = p.image;
      img.width = p.width;
      img.height = p.height;
      img.alt = "page-" + p.page;
    } else if (chunkOfPage.has(p.page) && p.status !== "failed") {
      const placeholder = el("div", "placeholder", page);
      placeholder.textContent = "page " + p.page + " — loading imagery…";
      deferred.set(p.page, placeholder);
    } else {
      el("div", "placeholder", page).textContent =
        "page " + p.page + (p.status === "failed" ? " — failed to parse"
          : " — source unavailable (boxes approximate)");
    }
    for (const e of ELS) {
      if (e.page !== p.page) continue;
      const label = ordinal.has(e.id) ? ordinal.get(e.id) + "." + e.type : e.type;
      if (e.type === "table_cell") {
        page.appendChild(boxNode(e.id, e.type, e.box, "sub cell", label));
      } else {
        page.appendChild(boxNode(e.id, e.type, e.box, "", label));
        // Region sub-boxes only when the model split finer than the element —
        // VUI DocExtractionAnnotationsDpt3 gates on parts.length >= 2.
        if ((e.atomic_grounding || []).length >= 2) {
          e.atomic_grounding.forEach((g, i) =>
            page.appendChild(boxNode(e.id + "-r" + i, e.type, g.box, "sub part")));
        }
      }
    }
  }
  // Scroll-triggered loading: a chunk fetches when any of its pages nears
  // the viewport (generous margin so scrolling rarely waits); page jumps
  // land inside the margin, so deep links and the page navigator trigger
  // it too. No IntersectionObserver (ancient embed) → load everything.
  if (deferred.size) {
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          loadChunk(chunkOfPage.get(Number(entry.target.dataset.page)));
          io.unobserve(entry.target);
        }
      }, { root: pane, rootMargin: "1500px 0px" });
      for (const num of deferred.keys()) {
        const node = pane.querySelector(`.page[data-page="${num}"]`);
        if (node) io.observe(node);
      }
    } else {
      for (const chunk of chunks) loadChunk(chunk);
    }
  }
  // Pagination state: the current page is the one with the largest
  // visible height in the pane. (The old IntersectionObserver at
  // threshold 0.4 marked ANY ≥40%-visible page current, last entry
  // winning — with a narrow pane several short pages qualify at once and
  // the bottom one sticks: "3/3" while reading page 2.) Ties keep the
  // earlier page.
  const pageEls = [...pane.querySelectorAll(".page")];
  const pagination = document.getElementById("pagination");
  if (pageEls.length) {
    pagination.hidden = false;
    document.getElementById("totalpages").textContent = String(pageEls.length);
  }
  let current = 0; // index into pageEls
  const setCurrent = idx => {
    current = idx;
    document.getElementById("curpage").textContent = String(idx + 1);
    document.getElementById("prevpage").disabled = idx <= 0;
    document.getElementById("nextpage").disabled = idx >= pageEls.length - 1;
  };
  setCurrent(0);
  const updateCurrent = () => {
    const paneRect = pane.getBoundingClientRect();
    let best = 0, bestVisible = -1;
    pageEls.forEach((page, i) => {
      const r = page.getBoundingClientRect();
      const visible = Math.max(
        0,
        Math.min(r.bottom, paneRect.bottom) - Math.max(r.top, paneRect.top),
      );
      if (visible > bestVisible + 1) { // +1: ties keep the earlier page
        bestVisible = visible;
        best = i;
      }
    });
    setCurrent(best);
  };
  // Timer-throttled (not rAF — rAF never fires in hidden/backgrounded
  // tabs and would freeze the counter): at most one rect sweep per 80ms
  // trailing window keeps rapid scrolling jank-free on page-heavy docs.
  let sweepTimer = null;
  pane.addEventListener("scroll", () => {
    if (sweepTimer !== null) return;
    sweepTimer = setTimeout(() => { sweepTimer = null; updateCurrent(); }, 80);
  }, { passive: true });
  window.addEventListener("resize", updateCurrent);
  updateCurrent();
  document.getElementById("prevpage").onclick = () =>
    pageEls[current - 1]?.scrollIntoView({ behavior: "smooth" });
  document.getElementById("nextpage").onclick = () =>
    pageEls[current + 1]?.scrollIntoView({ behavior: "smooth" });
})();

/* ── Markdown pane: the post-fix render cascade ──────────────────────────
   VUI Dpt3ChunksMarkdown.tsx:337-532 (2026-07-15 highlight fix): per
   top-level element — table → HTML table; NOT table + no children +
   parts>=2 → ONE <p whitespace-pre-line> of plain-text spans tiled by
   parts (tileElementSpanByParts, dpt3.ts:502-549); else markdown render. */
function tileByParts(e) {
  const parts = (e.atomic_grounding || [])
    .map((g, i) => ({ start: g.range.start, end: g.range.end, i }))
    .sort((a, b) => a.start - b.start);
  const base = e.span[0], end = e.span[1];
  const segments = [];
  let cursor = base;
  for (const part of parts) {
    const s = Math.max(part.start, cursor), pe = Math.min(part.end, end);
    if (s >= pe) continue; // fully covered by an earlier part (dpt3.ts:534-546)
    if (s > cursor) segments.push({ text: cpSlice(DATA.markdown, cursor, s) });
    segments.push({ text: cpSlice(DATA.markdown, s, pe), id: e.id + "-r" + part.i });
    cursor = pe;
  }
  if (cursor < end) segments.push({ text: cpSlice(DATA.markdown, cursor, end) });
  return segments;
}

// buildDpt3TableHtml equivalent — dpt3.ts:645-692: group by row, sort by
// col, colspan/rowspan only when > 1, cell text trimmed. (Cell ids deviate:
// see header note.) DOM building makes the escaping rules of
// escapeDpt3CellText (dpt3.ts:592-612) moot — textContent never parses HTML.
function tableBody(e, parent) {
  const cells = (e.cells || []).map(id => byId.get(id)).filter(Boolean);
  const table = el("table", "cells", parent);
  table.dataset.id = e.id;
  const rows = new Map();
  cells.forEach((c, idx) => {
    const r = c.row ?? idx;
    if (!rows.has(r)) rows.set(r, []);
    rows.get(r).push(c);
  });
  for (const rowIdx of [...rows.keys()].sort((a, b) => a - b)) {
    const tr = el("tr", "", table);
    for (const c of rows.get(rowIdx).sort((a, b) => (a.col ?? 0) - (b.col ?? 0))) {
      const td = el("td", "", tr);
      td.textContent = c.text.trim();
      if (!c.text.trim()) td.innerHTML = "&nbsp;"; // VUI MemoizedReactMarkdown td: empty → nbsp
      td.dataset.id = c.id;
      td.dataset.type = c.type;
      td.id = "md-" + c.id;
      if (c.colspan > 1) td.colSpan = c.colspan;
      if (c.rowspan > 1) td.rowSpan = c.rowspan;
    }
  }
}

(function markdown() {
  const pane = document.getElementById("content");
  // Bring-your-own-markdown items have no elements to tile — the pane
  // renders the input markdown whole (proposal: "markdown pane alone").
  if (DATA.kind === "markdown" && DATA.markdown) {
    renderMarkdown(DATA.markdown, el("div", "mdwhole", pane));
    return;
  }
  let prevPage = null;
  let first = true;
  for (const row of DATA.rows) {
    // Inter-element markdown (page-break comments, the doc_id trailer) is
    // not rendered — VUI's rows are elements only (Dpt3ChunksMarkdown.tsx:
    // 169-206); the data still tiles the whole markdown for consumers.
    if (row.gap !== undefined) continue;
    const e = ELS[row.el];
    // Page separator when the page changes — Dpt3ChunksMarkdown.tsx:267-269
    if (!first && e.page !== prevPage) el("hr", "pagesep", pane);
    prevPage = e.page;
    first = false;
    const div = el("div", "mdrow", pane);
    div.dataset.id = e.id;
    div.dataset.type = e.type;
    div.id = "md-" + e.id;
    div.style.setProperty("--c", color(e.type));
    // Floating label `${ordinal} - ${type}`, CSS-capitalized —
    // Dpt3ChunksMarkdown.tsx:297-315
    el("div", "mdlabel", div).textContent = ordinal.get(e.id) + " - " + e.type;
    if (e.type === "table") {
      tableBody(e, div);
    } else if (!e.cells && (e.atomic_grounding || []).length >= 2) {
      const p = el("p", "regions", div);
      for (const seg of tileByParts(e)) {
        const span = el("span", seg.id ? "region" : "", p);
        span.textContent = seg.text; // plain text by design (the fix's tradeoff)
        if (seg.id) {
          span.dataset.id = seg.id;
          span.dataset.type = e.type;
          span.style.setProperty("--c", color(e.type));
          span.id = "md-" + seg.id;
        }
      }
    } else {
      const body = el("div", "mdbody", div);
      body.dataset.id = e.id;
      body.dataset.type = e.type;
      renderMarkdown(e.text, body);
    }
  }
})();

/* ── JSON view — raw response, pretty-printed (Dpt3RawJsonView.tsx:106),
   Monaco "vs" token colors, and each top-level element's object wrapped as
   an interactive block — the static equivalent of the chunk-highlight
   overlay Dpt3RawJsonView builds from `"id"` declarations
   (buildDpt3Blocks, Dpt3RawJsonView.tsx:397-459). */
let jsonRendered = false;
function renderJson() {
  if (jsonRendered) return;
  jsonRendered = true;
  const out = document.getElementById("jsonview");
  const pad = n => " ".repeat(n);
  // `base` = the indent column a jblock starts at: inside the inline-block,
  // padding is written relative to it so the box's own x-offset isn't
  // double-counted.
  function write(value, indent, target, base) {
    if (value === null || typeof value === "boolean") {
      el("span", "j-lit", target).textContent = JSON.stringify(value);
    } else if (typeof value === "number") {
      el("span", "j-num", target).textContent = JSON.stringify(value);
    } else if (typeof value === "string") {
      el("span", "j-str", target).textContent = JSON.stringify(value);
    } else if (Array.isArray(value)) {
      if (!value.length) { target.append("[]"); return; }
      target.append("[\n");
      value.forEach((item, i) => {
        target.append(pad(indent + 2 - base));
        write(item, indent + 2, target, base);
        target.append((i < value.length - 1 ? "," : "") + "\n");
      });
      target.append(pad(indent - base) + "]");
    } else {
      // Top-level element objects become hover/click blocks sharing the
      // panes' id vocabulary (cells stay plain, like VUI's top-level-only
      // block walk in buildDpt3Blocks).
      let host = target;
      let innerBase = base;
      if (value.id && byId.has(value.id) && !parentOf.has(value.id)) {
        host = el("span", "jblock", target);
        host.dataset.id = value.id;
        host.dataset.type = value.type;
        host.style.setProperty("--c", color(value.type));
        innerBase = indent;
      }
      const keys = Object.keys(value);
      if (!keys.length) { host.append("{}"); return; }
      host.append("{\n");
      keys.forEach((key, i) => {
        host.append(pad(indent + 2 - innerBase));
        el("span", "j-key", host).textContent = JSON.stringify(key);
        host.append(": ");
        write(value[key], indent + 2, host, innerBase);
        host.append((i < keys.length - 1 ? "," : "") + "\n");
      });
      host.append(pad(indent - innerBase) + "}");
    }
  }
  write(DATA.raw_response, 0, out, 0);
}

(function toolbar() {

  const credits = DATA.receipt.billing && DATA.receipt.billing.total_credits;

  const getCode = () => format === "json"
    ? JSON.stringify(DATA.raw_response, null, 2) : DATA.markdown;

  const showCopied = () => {
    copied = true;
    const btn = document.getElementById("copy");
    btn.querySelector(".ic-copy").style.display = "none";
    btn.querySelector(".ic-check").style.display = "";
    setTimeout(() => {
      copied = false;
      btn.querySelector(".ic-copy").style.display = "";
      btn.querySelector(".ic-check").style.display = "none";
    }, 2000);
  };
  document.getElementById("copy").onclick = () => {
    if (copied) return; // VUI ProjectParseTab.tsx:512 (2s check swap)
    const text = getCode();
    const fallback = () => {
      // Clipboard API needs a secure context and can be denied on file://;
      // an off-screen textarea + execCommand still works there.
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      if (ok) showCopied();
      else window.prompt("Copy the text below", text);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied, fallback);
    } else {
      fallback();
    }
  };

  const eyebtn = document.getElementById("eyebtn");
  const eyepop = document.getElementById("eyepop");
  eyebtn.onclick = ev => { ev.stopPropagation(); eyepop.classList.toggle("open"); };
  document.addEventListener("click", ev => {
    if (!eyepop.contains(ev.target)) eyepop.classList.remove("open");
  });
  document.getElementById("fineswitch").onclick = function () {
    const on = !this.classList.contains("on");
    this.classList.toggle("on", on);
    this.setAttribute("aria-checked", String(on));
    document.body.classList.toggle("show-fine", on);
  };
})();

/* ── Extract tab — the parse → extract → evidence story (issue #10).
   Field→box references come precomputed from evidence.json (#8), the
   CLI-side equivalent of VUI's mapDpt3ExtractionMetadataToChunkRefs
   (dpt3.ts) + useGroundingMetadata bridge: extraction ranges and element
   spans index the same markdown, so each quoted field carries the
   element_ids/pages/boxes it overlaps. The viewer never re-joins —
   see the reference map on issue #10. */
// Escape ids before interpolating them into CSS selectors. Element ids
// (<type>-<index>) and extract ids (hex) are contract-safe today, but
// applyHash decodes arbitrary deep-link ids — CSS.escape keeps a stray
// character from throwing a DOMException and breaking selection/overlays.
const esc = s => CSS.escape(s);
let activeLayer = null;
function evidenceRefs(ex) {
  // A stale extraction's evidence recomputes as kind=spans_only —
  // its layer never draws boxes against the new parse's pages.
  if (!ex.evidence || ex.evidence.kind !== "grounded") return [];
  return [...new Set((ex.evidence.fields || []).flatMap(f => f.element_ids || []))];
}

function setLayer(extractId) {
  if (activeLayer) {
    const prev = (DATA.extractions || []).find(x => x.job_item_id === activeLayer);
    evidenceRefs(prev || {}).forEach(id =>
      document.querySelectorAll(`#pages .box[data-id="${esc(id)}"]`)
        .forEach(n => n.classList.remove("evid")));
  }
  activeLayer = extractId;
  if (!extractId) return;
  const ex = (DATA.extractions || []).find(x => x.job_item_id === extractId);
  evidenceRefs(ex || {}).forEach(id =>
    document.querySelectorAll(`#pages .box[data-id="${esc(id)}"]`)
      .forEach(n => n.classList.add("evid")));
}

// Token-colored JSON lines with a line→field-path map — the static
// equivalent of ExtractedDataJSONView's pathMap walk (:209-259): leaf
// `"key": value` lines map to dotted paths (arrays as [i], matching
// evidence.py's field naming) and become hover/click targets.
// Render a value as pretty JSON lines. Leaf lines carry a data-path built
// the SAME way evidence.py's metadata_leaves does — object children append
// ".key", array items append "[i]" (for items of ANY type, objects and
// arrays included) — so extraction line paths match the evidence field
// names byPath keys on. A recursive walk over the value guarantees that
// parity (a text scan can't reliably recover array indices for object
// items). `pathed` gates whether leaves are made interactive.
function jsonLines(value, container, pathed) {
  const rows = [];  // { text, path|null } per line
  function walk(val, label, path, indent, trailing) {
    const pad = "  ".repeat(indent);
    const head = label !== null ? JSON.stringify(label) + ": " : "";
    if (val === null || typeof val !== "object") {
      rows.push({ text: pad + head + JSON.stringify(val) + trailing, path });
    } else if (Array.isArray(val)) {
      if (!val.length) { rows.push({ text: pad + head + "[]" + trailing, path: null }); return; }
      rows.push({ text: pad + head + "[", path: null });
      val.forEach((item, i) =>
        walk(item, null, `${path}[${i}]`, indent + 1, i < val.length - 1 ? "," : ""));
      rows.push({ text: pad + "]" + trailing, path: null });
    } else {
      const keys = Object.keys(val);
      if (!keys.length) { rows.push({ text: pad + head + "{}" + trailing, path: null }); return; }
      rows.push({ text: pad + head + "{", path: null });
      keys.forEach((k, i) =>
        walk(val[k], k, path === "" ? k : `${path}.${k}`, indent + 1, i < keys.length - 1 ? "," : ""));
      rows.push({ text: pad + "}" + trailing, path: null });
    }
  }
  walk(value, null, "", 0, "");
  const rx = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)|(true|false|null)/g;
  for (const row of rows) {
    const div = el("div", "ex-line", container);
    if (pathed && row.path) div.dataset.path = row.path;
    // token coloring (Monaco vs, as in the parse JSON tab)
    let last = 0, m;
    rx.lastIndex = 0;
    while ((m = rx.exec(row.text)) !== null) {
      div.append(row.text.slice(last, m.index));
      if (m[1] !== undefined) el("span", m[2] ? "j-key" : "j-str", div).textContent = m[1] + (m[2] || "");
      else if (m[3] !== undefined) el("span", "j-num", div).textContent = m[3];
      else el("span", "j-lit", div).textContent = m[4];
      last = rx.lastIndex;
    }
    div.append(row.text.slice(last));
  }
}

// Type label + badge color per getTypeLabel/getTypeBadgeClasses
// (SchemaTreeEditor.tsx:205-243): arrays read "Array of <Item>", colored
// by the item type; numbers/integers share the Number badge.
// JSON Schema allows a union type, and ["string", "null"] is the ordinary way to spell
// a nullable field. Collapse a union to its non-null member before formatting: treating
// the array as a string threw TypeError out of schemaTree, so the panel rendered only as
// far as the first nullable leaf and then stopped, silently.
function soleType(type) {
  return Array.isArray(type) ? (type.find(t => t !== "null") || "null") : type;
}

function typeBadge(spec) {
  const type = soleType(spec.type);
  const display = type === "array"
    ? soleType(spec.items && spec.items.type) || "object" : type || "string";
  const norm = display === "integer" ? "number" : display;
  const label = norm.charAt(0).toUpperCase() + norm.slice(1);
  return {
    cls: "t-" + (["object", "string", "number", "boolean", "enum"].includes(norm) ? norm : "string"),
    label: type === "array" ? "Array of " + label : label,
  };
}

function schemaTree(node, container, prefix) {
  // Read-only SchemaTreeEditor rows (:462-486): name + colored type badge,
  // description on its own truncated row; nested children indented (:337).
  for (const [name, spec] of Object.entries((node && node.properties) || {})) {
    const path = prefix ? prefix + "." + name : name;
    const row = el("div", "sc-row", container);
    row.dataset.spath = path;
    const child = soleType(spec.type) === "array" ? spec.items : spec;
    const nested = !!(child && child.properties);
    if (nested) {
      const btn = el("button", "schevbtn", row);
      btn.setAttribute("aria-label", "Toggle " + name);
      btn.innerHTML = '<svg viewBox="0 0 12 12" fill="none"><path stroke-width="1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M4.5 3L7.5 6L4.5 9"/></svg>';
    }
    const line = el("div", "srow1", row);
    el("span", "sname", line).textContent = name;
    const badge = typeBadge(spec);
    el("span", "stype " + badge.cls, line).textContent = badge.label;
    if (spec.description) {
      const d = el("div", "sdesc", row);
      d.textContent = spec.description;
      d.title = spec.description;
    }
    if (nested) {
      const kids = el("div", "sc-kids", container);
      schemaTree(child, kids, path);
      row.querySelector(".schevbtn").onclick = ev => {
        ev.stopPropagation();
        const closed = row.classList.toggle("closed");
        kids.style.display = closed ? "none" : "";
      };
    }
  }
}

let shownExtract = null;
function buildExtract(extractId) {
  shownExtract = extractId;
  const ex = (DATA.extractions || []).find(x => x.job_item_id === extractId);
  if (!ex) return;
  const ev = ex.evidence || { kind: "spans_only", fields: [] };
  const grounded = ev.kind === "grounded";
  const byPath = new Map((ev.fields || []).map(f => [f.field, f]));
  const pane = document.getElementById("extract");
  pane.textContent = "";
  const split = el("div", "ex-split", pane);

  // Results LEFT — ProjectExtractionResults.tsx:65-125
  const results = el("div", "ex-results", split);
  const rhead = el("div", "ex-panel-head", results);
  el("span", "ptitle", rhead).textContent = "Results";
  // Partial-success signals (#118): an amber ⚠️ beside the title; hover
  // shows the messages. Text nodes only — both strings ride in from
  // stored response data.
  if (ex.schema_violation_error || (ex.warnings || []).length) {
    const warn = el("span", "ex-warn", rhead);
    warn.append("⚠️");
    const box = el("div", "ex-warn-box", el("div", "ex-warn-tip", warn));
    if (ex.schema_violation_error) {
      const line = el("div", "", box);
      el("b", "", line).textContent = "Partial extraction: ";
      line.append(ex.schema_violation_error);
    }
    for (const w of ex.warnings || []) {
      const line = el("div", "", box);
      el("b", "", line).textContent = "Warning: ";
      line.append(w && typeof w.message === "string" ? w.message : JSON.stringify(w));
    }
  }
  // Credit usage — same style and slot as the Parse toolbar's credits
  // (.credits, right-aligned). Text nodes, not innerHTML: the value rides
  // in from stored response data.
  if (ex.credit_usage != null) {
    const span = el("span", "credits", rhead);
    span.append(String(ex.credit_usage));
    el("b", "", span).textContent = " credit" + (ex.credit_usage === 1 ? "" : "s");
  }
  const rscroll = el("div", "ex-scroll", results);
  const section = (parent, title, open) => {
    const sec = el("div", "ex-section" + (open ? " open" : ""), parent);
    const head = el("div", "ex-sec-head", sec);
    el("span", "chev", head).textContent = "▶";
    head.append(title);
    head.onclick = () => sec.classList.toggle("open");
    return el("pre", "ex-json ex-sec-body", sec);
  };
  // "Extraction", default open (ExtractedDataJSONView.tsx:195,491-535)
  const extractionBody = section(rscroll, "Extraction", true);
  jsonLines(ex.extraction, extractionBody, true);
  for (const line of extractionBody.querySelectorAll(".ex-line[data-path]")) {
    const field = byPath.get(line.dataset.path);
    if (field && field.ungroundable) {
      const label = el("span", "linelabel", line);
      label.textContent = "ungroundable";
      label.title = "Synthesised, not quoted — no spans, no visual evidence.";
    } else if (field && field.empty) {
      // Quiet by design (F5): an empty value has nothing to ground —
      // expected for blank cells, distinct from ungroundable.
      const label = el("span", "linelabel", line);
      label.textContent = "empty";
      label.title = "No value extracted — nothing to ground.";
    }
    const refs = grounded && field ? field.element_ids || [] : [];
    // Highlight the field's schema row AND its ancestors — VUI's
    // prefix-match isHighlighted (SchemaTreeEditor.tsx:311-315).
    const schemaRows = () => {
      const stripped = line.dataset.path.replace(/\[\d+\]/g, "");
      return [...document.querySelectorAll(".sc-row")].filter(r =>
        stripped === r.dataset.spath || stripped.startsWith(r.dataset.spath + "."));
    };
    line.onmouseenter = () => { refs.forEach(id => mark(id, "hov", true)); schemaRows().forEach(r => r.classList.add("hl")); };
    line.onmouseleave = () => { refs.forEach(id => mark(id, "hov", false)); schemaRows().forEach(r => r.classList.remove("hl")); };
    line.onclick = () => {
      // Toggle: a literally-selected line clears the whole selection —
      // the same dismiss gesture as a selected canvas box (VUI
      // DocExtractionAnnotationsDpt3.tsx:242-251). VUI's Monaco JSON pane
      // deliberately never toggles (ExtractedDataJSONView.tsx:336-346)
      // because touch synthesizes duplicate mousedowns there; these are
      // plain DOM click handlers, one per tap, so that hazard doesn't
      // apply here.
      if (line.classList.contains("sel")) {
        select(null);
        return;
      }
      focusField(extractId, line.dataset.path, { flash: false });
    };
  }
  // "Extract Metadata", default closed (ExtractedDataJSONView.tsx:664-770)
  jsonLines(ex.extraction_metadata || {}, section(rscroll, "Extract Metadata", false), false);

  // Schema RIGHT — SchemaVersionSelector.tsx:69-210 header + tree body
  const schema = el("div", "ex-schema", split);
  const shead = el("div", "ex-panel-head", schema);
  el("span", "ptitle", shead).textContent = "Schema";
  if ((DATA.extractions || []).length > 1) {
    const pick = el("select", "", shead);
    for (const x of DATA.extractions) {
      const opt = el("option", "", pick);
      opt.value = x.job_item_id;
      opt.textContent = x.job_item_id + (x.stale ? " (stale)" : "");
      if (x.job_item_id === extractId) opt.selected = true;
    }
    pick.onchange = () => buildExtract(pick.value);
  } else {
    el("code", "", shead).textContent = ex.job_item_id;
  }
  if (ex.model) el("span", "badge", shead).textContent = ex.model;
  if (ex.stale) {
    const b = el("span", "badge stale", shead);
    b.textContent = "stale";
    b.title = "The original parse result was replaced by a newer parse run (--force re-parse), so this extraction is stale: it was produced against the previous run, its evidence indexes markdown that no longer exists, and no boxes are drawn on the new pages. Re-run ade extract to refresh it.";
  } else if (!grounded) {
    const b = el("span", "badge stale", shead);
    b.textContent = "spans only — " + (ev.reason || "no grounding");
  }
  schemaTree(ex.schema || {}, el("div", "sc-tree ex-scroll", schema), "");

  // Showing an extraction overlays all its grounded fields' boxes (#10).
  setLayer(extractId);
}

function focusField(extractId, fieldName, opts = {}) {
  // Build the target extraction BEFORE switching — switchTab auto-builds
  // the first extraction when none is shown, which would build twice.
  if (shownExtract !== extractId) buildExtract(extractId);
  switchTab("extract");
  const line = document.querySelector(
    `#extract .ex-line[data-path="${CSS.escape(fieldName)}"]`);
  if (!line) return;
  document.querySelectorAll("#extract .ex-line.sel").forEach(n => n.classList.remove("sel"));
  line.classList.add("sel");
  line.scrollIntoView({ block: "center" });
  const ex = (DATA.extractions || []).find(x => x.job_item_id === extractId);
  const field = ((ex && ex.evidence && ex.evidence.fields) || [])
    .find(f => f.field === fieldName);
  const refs = (ex && ex.evidence && ex.evidence.kind === "grounded" && field
    ? field.element_ids : null) || [];
  // A field with no evidence (empty / ungroundable / spans-only) clears any
  // element selection instead of leaving an unrelated box lit — VUI's
  // selectedPath effect pushes [] chunk ids for such fields
  // (ExtractedDataJSONView.tsx:393-397). fromField: this function owns the
  // line highlight, so select() must not resync it.
  if (refs.length) select(refs[0], { page: true, fromField: true });
  else select(null, { fromField: true });
  if (opts.flash) {
    [line, ...refs.flatMap(id => [...document.querySelectorAll(`#pages .box[data-id="${esc(id)}"]`)])]
      .forEach(n => {
        n.classList.remove("flash");
        void n.offsetWidth;
        n.classList.add("flash");
      });
  }
}

/* ── Pane sync: hover / select / deep links ──────────────────────────── */
const nodesFor = id => document.querySelectorAll(`[data-id="${esc(id)}"], #md-${esc(id)}`);
function mark(id, cls, on) {
  nodesFor(id).forEach(n => n.classList.toggle(cls, on));
  // Descendant-aware: the parent element counts as selected/hovered when a
  // cell or region of it is — VUI Dpt3ChunksMarkdown.tsx:249-257 and the
  // overlay's matching startsWith check. Only the parent's own row/box gets
  // the state (its other children stay unmarked).
  const owner = parentId(id);
  if (owner) {
    const row = document.getElementById("md-" + owner);
    if (row && row.classList.contains("mdrow")) row.classList.toggle(cls, on);
    document.querySelectorAll(`#pages .box[data-id="${esc(owner)}"]`)
      .forEach(n => n.classList.toggle(cls, on));
  }
}

let selected = null;
function select(id, opts = {}) {
  if (selected) {
    mark(selected, "sel", false);
    document.querySelectorAll("#pages .box.sub.reveal").forEach(n => n.classList.remove("reveal"));
  }
  selected = id;
  document.getElementById("clearsel").classList.toggle("on", !!id);
  document.body.classList.toggle("has-selection", !!id);
  if (!opts.fromField) syncFieldLines(id);
  if (!id) return;
  mark(id, "sel", true);
  const owner = parentId(id) || id;
  document.querySelectorAll(`#pages .box.sub[data-id^="${esc(owner)}-"]`)
    .forEach(n => n.classList.add("reveal"));
  const table = byId.get(owner);
  if (table && table.cells) {
    for (const c of table.cells)
      document.querySelectorAll(`#pages .box[data-id="${esc(c)}"]`)
        .forEach(n => n.classList.add("reveal"));
  }
  const scroll = node => node && node.scrollIntoView({ block: "center", behavior: "smooth" });
  if (opts.page) scroll(document.querySelector(`#pages [data-id="${esc(id)}"]`) ||
    document.querySelector(`#pages [data-id="${esc(owner)}"]`));
  if (opts.markdown) {
    // Right-pane scroll targets whichever format is showing — VUI's JSON
    // view centers the selected block the same way (revealLineInCenter).
    const jsonPane = document.getElementById("jsonview");
    if (jsonPane.style.display === "block") {
      // Manual scrollTo: smooth scrollIntoView silently no-ops on inline
      // spans taller than the scrollport (the multi-line element blocks).
      const block = document.querySelector(`#jsonview [data-id="${esc(owner)}"]`);
      if (block) {
        const blockRect = block.getBoundingClientRect();
        const paneRect = jsonPane.getBoundingClientRect();
        const top = Math.max(
          jsonPane.scrollTop + (blockRect.top - paneRect.top)
            - Math.max((jsonPane.clientHeight - blockRect.height) / 2, 12),
          0,
        );
        const from = jsonPane.scrollTop;
        jsonPane.scrollTo({ top, behavior: "smooth" });
        // Some environments drop smooth container scrolls outright
        // (reduced-motion embeds); if nothing moved, land instantly.
        setTimeout(() => {
          if (jsonPane.scrollTop === from && Math.abs(top - from) > 4) {
            jsonPane.scrollTop = top;
          }
        }, 250);
      }
    } else {
      scroll(document.getElementById("md-" + id) || document.getElementById("md-" + owner));
    }
  }
  if (opts.flash) {
    nodesFor(id).forEach(n => {
      n.classList.remove("flash");
      void n.offsetWidth;
      n.classList.add("flash");
    });
  }
}

// The extract pane's line highlight follows the one shared selection —
// VUI keeps a single selectedPath driving both panes: clearing the
// selection anywhere clears the line highlight too, and a doc-viewer
// click reverse-looks-up the first shown field citing the element
// (ExtractedDataJSONView.tsx:383-435). Skipped (fromField) when
// focusField drives the selection: it owns its own line highlight.
function syncFieldLines(id) {
  document.querySelectorAll("#extract .ex-line.sel")
    .forEach(n => n.classList.remove("sel"));
  if (!id) return;
  if (document.getElementById("extract").style.display !== "flex") return;
  const ex = (DATA.extractions || []).find(x => x.job_item_id === shownExtract);
  const field = ((ex && ex.evidence && ex.evidence.fields) || [])
    .find(f => (f.element_ids || []).includes(id));
  if (!field) return;
  const line = document.querySelector(
    `#extract .ex-line[data-path="${CSS.escape(field.field)}"]`);
  if (!line) return;
  line.classList.add("sel");
  line.scrollIntoView({ block: "center", behavior: "smooth" });
}

document.addEventListener("mouseover", ev => {
  const n = ev.target.closest("[data-id]");
  if (n) mark(n.dataset.id, "hov", true);
});
document.addEventListener("mouseout", ev => {
  const n = ev.target.closest("[data-id]");
  if (n) mark(n.dataset.id, "hov", false);
});
document.addEventListener("click", ev => {
  const n = ev.target.closest("[data-id]");
  if (!n || n.closest(".ex-field")) return;
  // Click toggles: a literally-selected target clears the selection —
  // VUI Dpt3ChunksMarkdown.tsx:288-296.
  if (n.dataset.id === selected) {
    select(null);
    return;
  }
  const fromPage = !!n.closest("#pages");
  select(n.dataset.id, { page: !fromPage, markdown: fromPage });
});
document.getElementById("clearsel").onclick = () => select(null);

// Deep links: #element=<id> scrolls and flashes both panes;
// #extract=<id>&field=<name> focuses the field in the extract rail AND
// its evidence boxes on the pages (issue #10's agent contract).
function applyHash() {
  // Capture id values up to the next & and decode — so percent-encoded or
  // otherwise non-[\w.-] ids in a deep link still resolve.
  const ex = location.hash.match(/extract=([^&]+)/);
  if (ex) {
    const extractId = decodeURIComponent(ex[1]);
    const fm = location.hash.match(/[#&]field=([^&]+)/);
    if (fm) {
      focusField(extractId, decodeURIComponent(fm[1]), { flash: true });
    } else {
      buildExtract(extractId);
      switchTab("extract");
    }
    return;
  }
  const m = location.hash.match(/element=([^&]+)/);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  if (byId.has(id) || byId.has(parentId(id) || "")) {
    switchTab("parse");
    select(id, { page: true, markdown: true, flash: true });
  }
}
window.addEventListener("hashchange", applyHash);
positionPills();
// Extract-kind items open on their extraction — that's what the run is;
// the Parse pill stays one click away. An explicit deep link (applyHash,
// next) still wins.
if (DATA.kind !== "parse" && (DATA.extractions || []).length) {
  switchTab("extract");
}
applyHash();
</script>
<script>
"use strict";
/* ── History sidebar ────────────────────────────────────────────────────

   and re-polled with cache-busted re-injection so the background builder's
